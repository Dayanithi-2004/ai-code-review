[project]
name = "revelyt"
version = "0.1.0"
description = "AI-powered code review CLI tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.10",
    "langchain-anthropic>=1.3.4",
    "langchain-google-genai>=4.2.1",
    "langchain-huggingface>=1.2.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.10",
    "markdown>=3.10.2",
    "pydantic>=2.12.5",
    "pygithub>=2.8.1",
    "pyyaml>=6.0",
    "rich>=14.3.3",
    "tiktoken>=0.12.0",
    "typer>=0.24.1",
    "xhtml2pdf>=0.2.17",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
revelyt = "revelyt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
